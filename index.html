<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1A1F" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Operan Jaga">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mapping Operan Jaga</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{touch-action:manipulation}
:root{
  /* Layout: lembar operan di ponsel. Header ringkas dengan progres, satu tab per pekerjaan, navigasi di bawah. Kode kamar bermonospasi seperti label tempat tidur; warna ruangan hanya titik penanda. */
  --bg:#EDF1F2; --surface:#FFFFFF; --surface2:#F4F7F8; --ink:#13242A; --muted:#566A70; --line:#D2DBDD;
  --accent:#0B5CAD; --on-accent:#FFFFFF; --accent-soft:#DDEBF8;
  --warn:#8A5200; --warn-bg:#FFF0D2; --danger:#B3261E; --on-danger:#FFFFFF;
  --w0:#D4472B; --w1:#D98A12; --w2:#B02F86; --w3:#7B5A3A; --w4:#2F7F6F; --w5:#5B5FC7;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A1F; --surface:#15262D; --surface2:#1B3039; --ink:#E7F0F2; --muted:#9DB3B9; --line:#28414A;
    --accent:#5AAEF0; --on-accent:#07202E; --accent-soft:#17384F;
    --warn:#F2B24C; --warn-bg:#3A2D10; --danger:#FF8F85; --on-danger:#2A0907;
    --w0:#FF8566; --w1:#F5B04A; --w2:#E27DC0; --w3:#C79B72; --w4:#62C2AD; --w5:#9EA3FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A1F; --surface:#15262D; --surface2:#1B3039; --ink:#E7F0F2; --muted:#9DB3B9; --line:#28414A;
  --accent:#5AAEF0; --on-accent:#07202E; --accent-soft:#17384F;
  --warn:#F2B24C; --warn-bg:#3A2D10; --danger:#FF8F85; --on-danger:#2A0907;
  --w0:#FF8566; --w1:#F5B04A; --w2:#E27DC0; --w3:#C79B72; --w4:#62C2AD; --w5:#9EA3FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-inline:16px;padding-block:0}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin-inline:auto;padding-bottom:110px}
h1{font:700 20px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
h2{font:700 19px/1.2 var(--f-display);margin:0;text-wrap:balance}
h3{font:600 14px/1.2 var(--f-body);margin:0}
p{margin:0}
.muted{color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:12px 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin-inline:auto}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.when{color:var(--muted);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.bar-t{font-size:12.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:720px;margin-inline:auto;display:flex}
.nav button{flex:1;min-height:56px;border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);position:relative;cursor:pointer}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}

/* generic */
.info{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
textarea,input[type=text],input[type=search],select{width:100%;min-width:0;font-size:15px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input[type=search]{-webkit-appearance:none;appearance:none}
textarea{font-family:var(--f-mono);font-size:13px;line-height:1.55;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font:600 14px var(--f-body);cursor:pointer}
.btn.sec{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.armed{background:var(--danger);color:var(--on-danger)}
.sum{margin-top:10px;font-size:13.5px;color:var(--muted)}
.flash{font-size:13px;color:var(--muted)}
.warnbox{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.warnbox ul{margin:6px 0 0;padding-left:18px;font-family:var(--f-mono);font-size:12px}
.empty{margin-top:18px;color:var(--muted);text-align:center;padding:18px 8px}
.tools{display:grid;gap:10px;margin-top:12px}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}

/* pills */
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-top:12px}
.tools .pills{margin-top:0}
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px var(--f-body);cursor:pointer;white-space:nowrap}
.pill .n{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill.on .n{color:inherit;opacity:.85}
.pill.off{border-style:dashed;color:var(--muted)}
.pill.off.on{color:var(--on-accent)}

/* program view */
.sechead{margin-top:6px;display:grid;gap:4px}
.hint{font-size:13.5px;color:var(--warn)}
.sub{font-size:13px;color:var(--muted)}
.ward{margin-top:18px}
.ward>header{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.cnt{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;min-height:54px;padding:8px 10px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer;position:relative}
.chip .code{max-width:100%;padding-right:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 11.5px var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.chip .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 14px var(--f-body)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.on .code{color:inherit;opacity:.85}
.chip.on::after{content:"\2713";position:absolute;top:6px;right:9px;font-size:13px}
.chip.empty .nm{font-weight:500;font-style:italic;color:var(--muted)}
.chip.empty.on .nm{color:inherit}
.fold{width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding:10px 12px;border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:8px;font:600 13.5px var(--f-body);cursor:pointer;text-align:left}
.fold[aria-expanded="true"]{border-style:solid}
.fold .n{font:500 12px var(--f-mono);color:var(--muted)}
.noterow{display:grid;gap:4px;margin-top:10px}
.who{display:flex;gap:8px;align-items:baseline;font-size:13.5px;min-width:0}
.who .code{font:500 12px var(--f-mono);color:var(--muted);flex:0 0 auto}
.who .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* patient view */
.prow{border:1px solid var(--line);background:var(--surface);border-radius:8px;margin-top:6px;overflow:hidden}
.prow-h{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;min-height:48px;padding:10px 12px;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer;font:inherit}
.prow-h .code{max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 12.5px var(--f-mono);color:var(--muted)}
.prow-h .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow-h .tags{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;max-width:100%;padding:2px 9px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:12px;font-weight:600}
.tag.none{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:500}
.tag.plain{background:var(--surface2);font-family:var(--f-mono);font-weight:500}
.chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;margin-right:4px}
.open .chev{transform:rotate(-135deg)}
.panel{border-top:1px solid var(--line);padding:12px;background:var(--surface2)}
.pgrid{display:flex;flex-wrap:wrap;gap:8px}
.panel .pill{background:var(--surface)}
.panel .pill.on{background:var(--accent)}
.help{font-size:12.5px;color:var(--muted);margin-bottom:8px}

.bedgrid{display:grid;gap:6px;margin-top:10px}
.bedcell{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;min-width:0}
.bedcell.wide{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.bedcell.wide .bc{grid-column:1 / -1}
.bc{font:500 11.5px var(--f-mono);letter-spacing:.03em;color:var(--muted)}
.bedcell input,.bedcell select{min-width:0;min-height:42px;padding:8px;font-size:14.5px}
.bedcell select{text-overflow:ellipsis;color:var(--muted)}
.bedcell.filled input{border-color:var(--accent);background:var(--surface);font-weight:600}
.bedcell select.filled{border-color:var(--accent);background:var(--surface);color:var(--ink);font-weight:600}
.dprow{margin-bottom:12px}
.dprow .lbl{margin-bottom:4px}
.dpt{font-size:12px;color:var(--muted);align-self:center}
.ward>.wfold{margin-top:0}
.wl{display:flex;align-items:center;gap:8px;min-width:0}

/* result */
#out{min-height:280px;margin-top:0}
details.card summary{cursor:pointer;font-weight:600;font-size:14px;min-height:28px}
details.card[open] summary{margin-bottom:10px}
.orph-w{margin-top:10px}
.orph-w b{display:block;font-size:13px;margin-bottom:6px}
.orph-w .tag{margin:0 6px 6px 0}
#add-form{display:grid;gap:10px;margin-top:12px}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@supports (-webkit-touch-callout: none){input,select,textarea{font-size:16px!important}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand"><h1>Mapping Operan Jaga</h1><span class="when" id="when"></span></div>
  <div class="bar" id="bar" role="progressbar" aria-label="Pasien yang sudah punya program" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="prog-fill"></i></div>
  <div class="bar-t" id="prog-text"></div>
</div></header>

<main class="wrap">
  <div class="info" id="sample" hidden>
    <span>Ini data contoh dengan nama rekaan. Ganti dengan daftar Anda di tab Data.</span>
    <button class="btn sec" type="button" data-act="tab" data-t="data">Buka tab Data</button>
  </div>

  <section id="v-data" hidden>
    <div class="info" id="install" hidden>
      <span id="install-t"></span>
      <button class="btn sec" type="button" id="install-btn" hidden>Pasang</button>
    </div>
    <div class="card">
      <label class="lbl">Daftar pasien</label>
      <p class="sub muted" style="font-size:13px">Ketik nama di tiap bed dan pilih DPJP-nya. Perubahan tersimpan otomatis. Bed yang dikosongkan dianggap tidak terisi.</p>
      <p class="sum" id="sum-pat" role="status"></p>
      <div id="pat-edit"></div>
      <div id="warn-pat"></div>
      <div class="row">
        <button class="btn danger" type="button" data-act="clear-names" data-label="Kosongkan semua nama">Kosongkan semua nama</button>
      </div>
      <button class="fold" type="button" id="paste-toggle" data-act="paste-toggle" aria-expanded="false"><span>Tempel daftar baru</span><span class="n">+</span></button>
      <div id="paste-box" hidden>
        <label class="lbl" for="ta-pat" style="margin-top:12px">Teks daftar pasien</label>
        <textarea id="ta-pat" rows="9" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Tempel daftar operan pasien di sini. Satu ruangan diawali namanya (Flamboyan 9), lalu baris kamar dan bed (901 A Nama / DPJP). DPJP boleh singkatan, misalnya Nefro, HO-Riza, dr. Hanum. Ini mengganti seluruh daftar."></textarea>
        <div class="row"><button class="btn" type="button" data-act="read-pat">Baca daftar pasien</button></div>
      </div>
    </div>
    <div class="card">
      <label class="lbl" for="ta-prog">Template program jaga</label>
      <textarea id="ta-prog" rows="9" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Tempel program jaga di sini. Kalau di bawah tiap ruangan sudah ada nama pasien, isiannya ikut dipulihkan."></textarea>
      <div class="row"><button class="btn" type="button" data-act="read-prog">Baca program</button></div>
      <p class="sum" id="sum-prog" role="status"></p>
      <div id="warn-prog"></div>
    </div>
    <div class="card">
      <label class="lbl">Mulai ulang</label>
      <p class="sub muted" style="font-size:13px">Nama pasien di satu bed berubah, programnya otomatis kosong lagi.</p>
      <div class="row">
        <button class="btn danger" type="button" data-act="clear-assign" data-label="Kosongkan semua program">Kosongkan semua program</button>
        <button class="btn danger" type="button" data-act="reset-sample" data-label="Reset ke bed kosong">Reset ke bed kosong</button>
      </div>
    </div>
  </section>

  <section id="v-prog">
    <div class="pills" id="sec-pills" role="group" aria-label="Pilih program"></div>
    <div class="sechead" id="sec-head"></div>
    <div class="tools">
      <input type="search" id="q-prog" placeholder="Cari nama atau kamar, mis. 904a" autocomplete="off">
      <label class="chk"><input type="checkbox" id="cb-empty-prog"> Tampilkan bed tanpa nama</label>
    </div>
    <div id="sec-wards"></div>
    <div id="sec-notes"></div>
  </section>

  <section id="v-pat" hidden>
    <div class="tools">
      <input type="search" id="q-pat" placeholder="Cari nama atau kamar" autocomplete="off">
      <div class="pills" role="group" aria-label="Saring pasien">
        <button class="pill on" type="button" data-act="flt" data-v="all" aria-pressed="true">Semua</button>
        <button class="pill" type="button" data-act="flt" data-v="none" aria-pressed="false">Belum ada program</button>
        <button class="pill" type="button" data-act="flt" data-v="some" aria-pressed="false">Sudah ada program</button>
      </div>
      <label class="chk"><input type="checkbox" id="cb-empty-pat"> Tampilkan bed tanpa nama</label>
    </div>
    <div id="pat-list"></div>
    <div class="card">
      <button class="fold" id="add-toggle" type="button" data-act="add-toggle" aria-expanded="false" style="margin-top:0">Tambah pasien baru <span class="n">+</span></button>
      <div id="add-form" hidden>
        <div><label class="lbl" for="add-ward">Ruangan</label><select id="add-ward"></select></div>
        <div><label class="lbl" for="add-rb">Kamar dan bed</label><input type="text" id="add-rb" placeholder="mis. 910 B, atau nama kamar khusus" autocomplete="off"></div>
        <div><label class="lbl" for="add-name">Nama</label><input type="text" id="add-name" autocomplete="off"></div>
        <div class="row" style="margin-top:0"><button class="btn" type="button" data-act="add">Tambahkan</button><span class="flash" id="add-msg" role="status"></span></div>
      </div>
    </div>
  </section>

  <section id="v-out" hidden>
    <p class="sum" id="out-sum" style="margin-top:14px"></p>
    <label class="chk"><input type="checkbox" id="cb-hide"> Sembunyikan ruangan yang kosong</label>
    <label class="chk"><input type="checkbox" id="cb-dp"> Sertakan DPJP di tiap pasien</label>
    <label class="lbl" for="out">Teks untuk WhatsApp</label>
    <textarea id="out" readonly spellcheck="false"></textarea>
    <div class="row"><button class="btn" id="copy" type="button" data-act="copy">Salin teks</button><span class="flash" id="copy-msg" role="status"></span></div>
    <details class="card" id="orph"><summary id="orph-sum"></summary><div id="orph-body"></div></details>
  </section>
</main>

<nav class="nav" aria-label="Tab"><div class="nav-in">
  <button type="button" data-act="tab" data-t="data">Data</button>
  <button type="button" data-act="tab" data-t="prog" aria-current="page">Program</button>
  <button type="button" data-act="tab" data-t="pat">Pasien</button>
  <button type="button" data-act="tab" data-t="out">Hasil</button>
</div></nav>

<script>
(function(){
'use strict';
// ==LOGIC START==
function norm(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function slug(s){ return norm(s).replace(/ /g,'-'); }
function clean(s){ return String(s==null?'':s).replace(/[*_]/g,'').replace(/\s+/g,' ').trim(); }
function has(o,k){ return !!o && Object.prototype.hasOwnProperty.call(o,k); }
function wardMatch(a,b){
  a=norm(a); b=norm(b);
  if(!a||!b) return false;
  return a===b || a.indexOf(b+' ')===0 || b.indexOf(a+' ')===0;
}
var BED_RE=/^(\d{2,4})\s*([A-Fa-f])(.*)$/;
var WARD_RE=/^[A-Za-z]+(?:\s+\d+)?$/;
var SEP_RE=/^[-–—_=~]{3,}$/;
var SPECIAL_RE=/^(.*?\b[IVX]+)\s+(\S.*)$/;

function parseBed(line){
  var m=BED_RE.exec(line);
  if(!m) return null;
  var rest=m[3];
  if(rest && !/^\s/.test(rest) && !/^[A-Z]/.test(rest)) return null;
  return {room:m[1],bed:m[2].toUpperCase(),name:rest.replace(/\s+/g,' ').trim()};
}
function mkId(p){ return p.wkey+'|'+p.room+'|'+p.bed+'|'+norm(p.name); }

function parsePatients(text){
  var wards=[], patients=[], warnings=[], cur=null, ids={};
  function ward(label){
    var k=norm(label);
    for(var i=0;i<wards.length;i++) if(wards[i].key===k) return wards[i];
    var w={label:label,key:k}; wards.push(w); return w;
  }
  function add(w,room,bed,name,special){
    var sp=splitDp(name); name=sp.name;
    var p={ward:w.label,wkey:w.key,room:room,bed:bed,name:name,dp:sp.dp,special:special,manual:false};
    p.id=mkId(p);
    if(ids[p.id]){ warnings.push('Dobel: '+room+' '+bed+' '+name); return; }
    ids[p.id]=1; patients.push(p);
  }
  String(text||'').split(/\r?\n/).forEach(function(raw){
    var line=clean(raw);
    if(!line||SEP_RE.test(line)) return;
    var b=parseBed(line);
    if(b){
      if(!cur){ warnings.push(line); return; }
      add(cur,b.room,b.bed,b.name,false); return;
    }
    if(WARD_RE.test(line)){ cur=ward(line); return; }
    if(!cur) return;
    var pp=/^(.+?)\s*\|\s*(.*)$/.exec(line);

function mergeManual(model,manual){
  (manual||[]).forEach(function(m){
    var k=norm(m.ward), w=null, i;
    for(i=0;i<model.wards.length;i++) if(model.wards[i].key===k) w=model.wards[i];
    if(!w){ w={label:m.ward,key:k}; model.wards.push(w); }
    var hit=null;
    model.patients.forEach(function(p){ if(p.wkey===k&&p.room===m.room&&p.bed===(m.bed||'')) hit=p; });
    if(hit){
      if(!hit.name){ hit.name=m.name; hit.manual=true; hit.id=mkId(hit); }
    } else {
      var p={ward:w.label,wkey:k,room:m.room,bed:m.bed||'',name:m.name,special:!m.bed,manual:true};
      p.id=mkId(p); model.patients.push(p);
    }
  });
  var order={};
  model.wards.forEach(function(w,i){ order[w.key]=i; });
  model.patients.forEach(function(p,i){ p._o=i; });
  model.patients.sort(function(a,b){
    if(order[a.wkey]!==order[b.wkey]) return order[a.wkey]-order[b.wkey];
    if(a.special!==b.special) return a.special?1:-1;
    if(a.special) return a._o-b._o;
    var ra=parseInt(a.room,10), rb=parseInt(b.room,10);

function parseSectionHeader(line){
  if(line.indexOf('_')<0 || !/^[*_]/.test(line)) return null;
  var m=/^[*_\s]+([^*_]+?)[*_]+\s*(.*)$/.exec(line);
  if(!m) return null;
  var title=m[1].replace(/[^\p{L}\p{N}\s\/&().,+-]/gu,'').replace(/\s+/g,' ').trim();
  if(!title) return null;
  return {title:title,hint:m[2].trim(),raw:line};
}
function parseWardLine(line){

  return null;

function parseProgram(text){

  String(text||'').split(/\r?\n/).forEach(function(raw){
    var line=raw.trim();
    if(!line||SEP_RE.test(line)) return;
    var sh=parseSectionHeader(line);
    if(sh){
      var base=slug(sh.title)||'program', id=base, n=2;
      while(used[id]){ id=base+'-'+n; n++; }
      used[id]=1;
      cur={id:id,title:sh.title,hint:sh.hint,raw:sh.raw,wards:[]};
      sections.push(cur); curWard=null; return;
    }
    if(!cur){ pre.push(line); return; }
    var wl=parseWardLine(line);
    if(wl){ curWard={raw:line,label:wl,key:norm(wl)}; cur.wards.push(curWard); return; }
    entries.push({sec:cur.id,ward:curWard?curWard.label:'',line:line});
  });
  return {pre:pre,sections:sections,entries:entries};
}

function restoreEntries(entries,patients,dpmap){
  var assign={}, ok=0, bad=0;
  entries.forEach(function(e){
    var line=clean(e.line), b=parseBed(line), p=null, rest='', c;
    if(b){
      c=patients.filter(function(x){ return !x.special&&x.room===b.room&&x.bed===b.bed&&(!e.ward||wardMatch(x.ward,e.ward)); });
      if(c.length===1){ p=c[0]; rest=b.name; }
    } else {
      var low=line.toLowerCase();
      c=patients.filter(function(x){ return x.special&&low.indexOf(x.room.toLowerCase())===0&&(!e.ward||wardMatch(x.ward,e.ward)); });
      if(c.length===1){ p=c[0]; rest=line.slice(p.room.length).trim(); }
    }
    if(!p||!p.name){ bad++; return; }
    var note=rest;
    if(rest.toLowerCase().indexOf(p.name.toLowerCase())===0) note=rest.slice(p.name.length);
    var dps=dpmap&&dpmap[p.id];
    if(dps){
      var tt=note.replace(/^\s+/,'');
      if(tt.toLowerCase().indexOf('('+dps.toLowerCase()+')')===0) note=tt.slice(dps.length+2);
    }
    note=note.replace(/^[\s\-–—:,(]+/,'').replace(/[\s)]+$/,'');
    if(!has(assign,p.id)) assign[p.id]={};
    assign[p.id][e.sec]=note; ok++;
  });
  return {assign:assign,ok:ok,bad:bad};
}

  return s;
}

function buildOutput(M,opt){
  var out=[], assign=M.assign||{};
  (M.pre||[]).forEach(function(l){ out.push(l); });
  if(M.pre&&M.pre.length) out.push('');
  M.sections.forEach(function(sec){
    var picked=M.patients.filter(function(p){ return has(assign[p.id],sec.id); });
    var used={}, blocks=[], labels=[];
    sec.wards.forEach(function(t){
      var list=picked.filter(function(p){ return wardMatch(p.ward,t.label); });
      list.forEach(function(p){ used[p.id]=1; });
      blocks.push({raw:t.raw,list:list});
    });
    picked.forEach(function(p){ if(!used[p.id]&&labels.indexOf(p.ward)<0) labels.push(p.ward); });
    labels.forEach(function(l){
      blocks.push({raw:'*'+l+'*',list:picked.filter(function(p){ return !used[p.id]&&p.ward===l; })});
    });
    out.push(sec.raw);
    var shown=0;
    blocks.forEach(function(b){
      if(opt&&opt.hideEmpty&&!b.list.length) return;
      out.push(b.raw);
      b.list.forEach(function(p){ out.push(fmtEntry(p,assign[p.id][sec.id],(opt&&opt.withDp&&M.dp)?M.dp[p.id]:'')); });
      out.push(''); shown++;
    });
    if(!shown) out.push('');
  });
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

function dpTokMatch(t,short,minLen){
  var names=norm(short).split(' ').filter(function(n){ return n&&n!=='dr'&&n!=='h'; });
  return names.some(function(n){
    if(t.length>=minLen&&n.indexOf(t)===0) return true;
    var cp=0; while(cp<t.length&&cp<n.length&&t.charAt(cp)===n.charAt(cp)) cp++;
    if(cp>=3&&cp>=t.length-1) return true;
    if(t.length>=(minLen<2?2:3)&&t.charAt(0)===n.charAt(0)){
      var j=0; for(var k=0;k<n.length&&j<t.length;k++) if(n.charAt(k)===t.charAt(j)) j++;
      return j===t.length;
    }
    return false;
  });
}
function matchDp(text,docs){
  var toks=norm(text).split(' ').filter(Boolean), group='', rest=[];
  if(!toks.length) return {id:'',status:'empty',group:''};
  toks.forEach(function(t){
    if(has(DP_ALIAS,t)){ if(!group) group=DP_ALIAS[t]; }
    else if(t!=='dr'&&t!=='drg'&&t!=='dokter'&&t!=='h'&&!/^\d+$/.test(t)) rest.push(t);
  });
  var pool=group?docs.filter(function(d){ return d.group===group; }):docs;
  if(rest.length){
    var minLen=group?1:2;
    var hit=pool.filter(function(d){ return rest.every(function(t){ return dpTokMatch(t,d.short,minLen); }); });
    if(hit.length===1) return {id:hit[0].id,status:'ok',group:hit[0].group};
    if(hit.length>1) return {id:'',status:'ambiguous',group:group};
  }
  if(group&&pool.length===1) return {id:pool[0].id,status:'ok',group:group};
  if(group) return {id:'',status:'group',group:group};
  return {id:'',status:'none',group:''};
}
function serializePatients(wards,patients){
  var out=[];

    if(!list.length) return;

    var last=null;
    list.forEach(function(p){
      var key=p.special?'~'+p.room:p.room;
      if(last!==null&&last!==key) out.push('');
      last=key;
      out.push(p.special?(p.room+' | '+p.name).trim():(p.room+' '+p.bed+(p.name?' '+p.name:'')));
    });
    out.push('');
  });
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

function toggle(p,sec){
  if(!p||!sec) return;
  var a=S.assign[p.id]||(S.assign[p.id]={});

function readPatients(){
  var v=$('#ta-pat').value;
  if(norm(v)!==norm(S.patientsRaw)) S.manual=[];
  S.patientsRaw=v; S.sample=false; ui.pasteOpen=false; ui.dpOk=0; ui.dpBad=[]; rebuild(); importDp(); save(); rerender();

function readProgram(){
  S.programRaw=$('#ta-prog').value; S.sample=false; rebuild();
  var r=restoreEntries(S.entries,S.patients,dpMap());
  Object.keys(r.assign).forEach(function(k){
    if(!S.assign[k]) S.assign[k]={};
    Object.keys(r.assign[k]).forEach(function(s){ S.assign[k][s]=r.assign[k][s]; });
  });
  ui.msgProg=(r.ok||r.bad)?(r.ok+' baris isian dipulihkan'+(r.bad?', '+r.bad+' tidak cocok dengan daftar pasien':'')+'.'):'';
  ui.pillsKey=''; save(); rerender();

function addPatient(){
  var ward=$('#add-ward').value, rb=$('#add-rb').value.trim(), nm=$('#add-name').value.trim(), msg=$('#add-msg');
  if(!ward||!rb||!nm){ msg.textContent='Isi ruangan, kamar dan bed, serta nama.'; return; }
  var b=parseBed(clean(rb)), room, bed;
  if(b){ room=b.room; bed=b.bed; } else { room=clean(rb); bed=''; }
  var ex=findP(ward,room,bed);
  if(ex&&ex.name){ msg.textContent='Bed itu sudah terisi atas nama '+ex.name+'.'; return; }
  S.manual.push({ward:ward,room:room,bed:bed,name:nm});
  rebuild();
  var p=findP(ward,room,bed);
  if(p){ ui.open=p.id; ui.flt='all'; }
  $('#add-rb').value=''; $('#add-name').value='';
  msg.textContent='Ditambahkan. Pilih programnya di bawah ruangan '+ward+'.';
  save(); rerender();

    navigator.clipboard.writeText(o.value).then(function(){ done(true); },fb);

/* Pembaruan otomatis: setiap aplikasi dibuka kembali, cek apakah index.html di server berubah. Kalau ya, muat ulang. */
(function(){
  var base=null;
  function sig(t){ var h=0; for(var i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))|0; return t.length+':'+h; }
  function get(){ return fetch('index.html?v='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.text():null; }); }
  function check(){
    if(!navigator.onLine) return;
    get().then(function(t){
      if(!t) return;
      var s=sig(t);
      if(base===null){ base=s; return; }
      if(s===base) return;
      var last=0; try{ last=+sessionStorage.getItem('upd-at')||0; }catch(e){}
      if(Date.now()-last<60000) return;
      try{ sessionStorage.setItem('upd-at',String(Date.now())); }catch(e){}
      setTimeout(function(){ location.reload(); },600);
    }).catch(function(){});
  }
  window.addEventListener('load',check);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') check(); });
})();
})();
</script>
</body>
</html>
